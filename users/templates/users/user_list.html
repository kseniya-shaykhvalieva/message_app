{% extends 'mailing_service/base.html' %}
{% block content%}
<style>
    html, body { height: 100%; margin: 0; padding: 0; }
</style>
<div class="card" style="border-radius: 10px; overflow: hidden; min-height: 100vh; margin-bottom: 0;">
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark" aria-label="Third navbar example">
        <div class="container-fluid"><a class="navbar-brand">Список пользователей</a></div>
    </nav>
    <div class="container-fluid bg-dark text-white" style="flex-grow: 1;">
        {% for user in object_list %}
        <div class="row bg-secondary bg-opacity-75 text-white p-2 mb-2 rounded-3">
            <div class="col-3 text-start">{{ user.last_name }}</div>
            <div class="col-3 text-start">{{ user.first_name }}</div>
            <div class="col-3 text-start">{{ user.patronymic }}</div>
            <div class="col-3 text-start">
                <form method="post" action="{% url 'users:user_block' user.pk %}">
                    {% csrf_token %}
                    <button class="btn btn-light btn-sm text-decoration-none">
                        {% if user.is_active %}
                        Заблокировать
                        {% else %}
                        Разблокировать
                        {% endif %}
                    </button>
                </form>
            </div>

        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
