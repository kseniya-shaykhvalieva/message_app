{% extends 'mailing_service/base.html' %}
{% block content%}
<style>
    html, body { height: 100%; margin: 0; padding: 0; }
</style>
<div class="card" style="border-radius: 10px; overflow: hidden; min-height: 100vh; margin-bottom: 0;">
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark" aria-label="Third navbar example">
        <div class="container-fluid"><a class="navbar-brand">Сообщения</a></div>
        {% if not perms.mailing_service.can_deactivate_mailing %}
        <a href="{% url 'mailing_service:message_create' %}"
           class="btn btn-light me-3">Создать</a>
        {% endif %}
    </nav>
    <div class="container-fluid bg-dark text-white" style="flex-grow: 1;">
        {% for message in object_list %}
        <div class="row bg-secondary bg-opacity-75 text-white p-2 mb-2 rounded-3">
            <div class="col-4 text-start">
                <a href="{% url 'mailing_service:message_detail' message.pk %}"
                   class="text-white text-decoration-none">{{ message.subject }}</a>
            </div>
            <div class="col-8 text-start">
                <a href="{% url 'mailing_service:message_detail' message.pk %}"
                   class="text-white text-decoration-none">{{ message.body|truncatechars:100 }}</a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
