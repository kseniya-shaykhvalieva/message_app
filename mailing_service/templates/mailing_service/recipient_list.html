{% extends 'mailing_service/base.html' %}
{% block content%}
<style>
    html, body { height: 100%; margin: 0; padding: 0; }
</style>
<div class="card" style="border-radius: 10px; overflow: hidden; min-height: 100vh; margin-bottom: 0;">
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark" aria-label="Third navbar example">
        <div class="container-fluid"><a class="navbar-brand">Получатели</a></div>
        <a href="{% url 'mailing_service:recipient_create' %}"
           class="btn btn-light me-3">Создать</a>
    </nav>
    <div class="container-fluid bg-dark text-white" style="flex-grow: 1;">
        {% for recipient in object_list %}
        <div class="row bg-secondary bg-opacity-75 text-white p-2 mb-2 rounded-3">
            <div class="col-4 text-start">
                <a href="{% url 'mailing_service:recipient_detail' recipient.pk %}"
                   class="text-white text-decoration-none">{{ recipient.name }}</a>
            </div>
            <div class="col-4 text-start">
                <a href="{% url 'mailing_service:recipient_detail' recipient.pk %}"
                   class="text-white text-decoration-none">{{ recipient.email }}</a>
            </div>
            <div class="col-4 text-start">{{ recipient.comment|truncatechars:50 }}</div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
